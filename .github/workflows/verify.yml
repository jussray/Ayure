name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # `npm run build` is the OpenNext Worker build (same command Workers Builds runs).
      - run: npm run build
      - name: Worker bundle exists (what `wrangler deploy` needs)
        run: test -f .open-next/worker.js && test -d .open-next/assets && ls -la .open-next/worker.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
